<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Build Bridge — ログイン</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary:  #060a0f;
      --bg-card:     #0d1117;
      --bg-surface:  #161b22;
      --border:      #21262d;
      --text-primary:#e6edf3;
      --text-muted:  #7d8590;
      --accent:      #1D9E75;
      --accent-light:#14b8a6;
      --red:         #ef4444;
      --shadow:      0 4px 24px rgba(0,0,0,.4);
      --radius-card: 12px;
      --radius-btn:  8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
    }

    /* ── ロゴ ── */
    .logo-wrap {
      text-align: center;
      margin-bottom: 36px;
    }

    .logo {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.9rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.02em;
    }

    .logo span {
      color: var(--text-muted);
      font-size: 0.75em;
      font-weight: 500;
      margin-left: 6px;
    }

    .tagline {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 6px;
    }

    /* ── カード ── */
    .card {
      width: 100%;
      max-width: 400px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: 32px 28px;
      box-shadow: var(--shadow);
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 24px;
      text-align: center;
    }

    /* ── フォーム ── */
    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-btn);
      color: var(--text-primary);
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--accent);
    }

    input::placeholder {
      color: var(--text-muted);
      opacity: 0.6;
    }

    /* ── ボタン ── */
    .btn-primary {
      width: 100%;
      padding: 13px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius-btn);
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      margin-top: 8px;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-light);
      transform: translateY(-1px);
    }

    .btn-primary:active:not(:disabled) {
      transform: scale(0.98);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* ── エラー・メッセージ ── */
    .message {
      font-size: 0.82rem;
      padding: 10px 14px;
      border-radius: var(--radius-btn);
      margin-bottom: 16px;
      display: none;
    }

    .message.error {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }

    .message.success {
      background: rgba(29, 158, 117, 0.12);
      border: 1px solid rgba(29, 158, 117, 0.3);
      color: var(--accent-light);
    }

    .message.show { display: block; }

    /* ── 言語セレクター ── */
    .lang-bar {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 28px;
    }

    .lang-btn {
      padding: 5px 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: transparent;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }

    .lang-btn.active {
      border-color: var(--accent);
      color: var(--accent-light);
      background: rgba(20, 184, 166, 0.1);
    }

    /* ── Remember me チェックボックス ── */
    .remember-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      cursor: pointer;
      user-select: none;
    }

    .remember-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
      cursor: pointer;
      flex-shrink: 0;
    }

    .remember-label {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    /* ── スピナー ── */
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── フッター ── */
    .footer-note {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 24px;
      line-height: 1.6;
    }

    .fade-in {
      opacity: 0;
      transform: translateY(16px);
      animation: fadeInUp 0.4s ease forwards;
    }

    @keyframes fadeInUp {
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- ロゴ -->
  <div class="logo-wrap fade-in" style="animation-delay:0s">
    <div class="logo">Build Bridge<span>β</span></div>
    <p class="tagline" id="tagline">学習で、未来をつなぐ。</p>
  </div>

  <!-- 言語切り替え -->
  <div class="lang-bar fade-in" style="animation-delay:0.05s">
    <button class="lang-btn active" data-lang="ja">JA</button>
    <button class="lang-btn" data-lang="en">EN</button>
    <button class="lang-btn" data-lang="vi">VI</button>
    <button class="lang-btn" data-lang="id">ID</button>
  </div>

  <!-- ログインカード -->
  <div class="card fade-in" style="animation-delay:0.1s">
    <h1 class="card-title" id="cardTitle">ログイン</h1>

    <div class="message error" id="errorMsg"></div>
    <div class="message success" id="successMsg"></div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label id="labelEmail">メールアドレス</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required>
      </div>
      <div class="field">
        <label id="labelPassword">パスワード</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <label class="remember-row">
        <input type="checkbox" id="rememberMe">
        <span class="remember-label" id="labelRemember">ログイン情報を保存する</span>
      </label>
      <button class="btn-primary" type="submit" id="submitBtn">
        <span id="submitLabel">ログイン</span>
      </button>
    </form>
  </div>

  <p class="footer-note fade-in" style="animation-delay:0.2s" id="footerNote">
    アカウントは管理者から発行されます。
  </p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ── Supabase 初期化 ──
    const SUPABASE_URL     = 'https://ztedlnyeeodvdyxzqpiz.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_WFtrwdK97JIawHiQZyLELg_h08mZifP';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ── i18n ──
    const i18n = {
      ja: {
        tagline:       '学習で、未来をつなぐ。',
        cardTitle:     'ログイン',
        labelEmail:    'メールアドレス',
        labelPassword: 'パスワード',
        submitLabel:   'ログイン',
        loading:       'ログイン中...',
        footerNote:    'アカウントは管理者から発行されます。',
        errEmpty:      'メールアドレスとパスワードを入力してください。',
        errInvalid:    'メールアドレスまたはパスワードが正しくありません。',
        errGeneric:    'ログインに失敗しました。しばらく後で再試行してください。',
        successMsg:    'ログイン成功！リダイレクト中...',
        labelRemember: 'ログイン情報を保存する',
      },
      en: {
        tagline:       'Bridging futures through learning.',
        cardTitle:     'Sign in',
        labelEmail:    'Email',
        labelPassword: 'Password',
        submitLabel:   'Sign in',
        loading:       'Signing in...',
        footerNote:    'Accounts are issued by your administrator.',
        errEmpty:      'Please enter your email and password.',
        errInvalid:    'Incorrect email or password.',
        errGeneric:    'Login failed. Please try again later.',
        successMsg:    'Login successful! Redirecting...',
        labelRemember: 'Remember me',
      },
      vi: {
        tagline:       'Kết nối tương lai qua học tập.',
        cardTitle:     'Đăng nhập',
        labelEmail:    'Email',
        labelPassword: 'Mật khẩu',
        submitLabel:   'Đăng nhập',
        loading:       'Đang đăng nhập...',
        footerNote:    'Tài khoản do quản trị viên cấp.',
        errEmpty:      'Vui lòng nhập email và mật khẩu.',
        errInvalid:    'Email hoặc mật khẩu không đúng.',
        errGeneric:    'Đăng nhập thất bại. Vui lòng thử lại.',
        successMsg:    'Đăng nhập thành công! Đang chuyển hướng...',
        labelRemember: 'Ghi nhớ thông tin đăng nhập',
      },
      id: {
        tagline:       'Menghubungkan masa depan melalui belajar.',
        cardTitle:     'Masuk',
        labelEmail:    'Email',
        labelPassword: 'Kata Sandi',
        submitLabel:   'Masuk',
        loading:       'Sedang masuk...',
        footerNote:    'Akun diterbitkan oleh administrator Anda.',
        errEmpty:      'Masukkan email dan kata sandi Anda.',
        errInvalid:    'Email atau kata sandi salah.',
        errGeneric:    'Gagal masuk. Coba lagi nanti.',
        successMsg:    'Berhasil masuk! Mengalihkan...',
        labelRemember: 'Ingat saya',
      },
    };

    let currentLang = localStorage.getItem('bb_ui_lang') || 'ja';

    function t(key) {
      return (i18n[currentLang] || i18n.ja)[key] || key;
    }

    function applyLang() {
      document.getElementById('tagline').textContent        = t('tagline');
      document.getElementById('cardTitle').textContent      = t('cardTitle');
      document.getElementById('labelEmail').textContent     = t('labelEmail');
      document.getElementById('labelPassword').textContent  = t('labelPassword');
      document.getElementById('submitLabel').textContent    = t('submitLabel');
      document.getElementById('footerNote').textContent     = t('footerNote');
      document.getElementById('labelRemember').textContent  = t('labelRemember');
      document.documentElement.lang = currentLang;
    }

    // 言語ボタン
    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        currentLang = btn.dataset.lang;
        localStorage.setItem('bb_ui_lang', currentLang);
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        applyLang();
        hideMessages();
      });
    });

    // ── メッセージ表示 ──
    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.classList.add('show');
      document.getElementById('successMsg').classList.remove('show');
    }

    function showSuccess(msg) {
      const el = document.getElementById('successMsg');
      el.textContent = msg;
      el.classList.add('show');
      document.getElementById('errorMsg').classList.remove('show');
    }

    function hideMessages() {
      document.getElementById('errorMsg').classList.remove('show');
      document.getElementById('successMsg').classList.remove('show');
    }

    // ── ローディング状態 ──
    function setLoading(loading) {
      const btn   = document.getElementById('submitBtn');
      const label = document.getElementById('submitLabel');
      btn.disabled = loading;
      label.innerHTML = loading
        ? `<span class="spinner"></span>${t('loading')}`
        : t('submitLabel');
    }

    // ── ログイン情報の保存・復元 ──
    const REMEMBER_KEY = 'bb_remembered_email';

    function loadRemembered() {
      const saved = localStorage.getItem(REMEMBER_KEY);
      if (saved) {
        document.getElementById('email').value = saved;
        document.getElementById('rememberMe').checked = true;
      }
    }

    function saveRemembered(email, remember) {
      if (remember) {
        localStorage.setItem(REMEMBER_KEY, email);
      } else {
        localStorage.removeItem(REMEMBER_KEY);
      }
    }

    loadRemembered();

    // ── ログイン ──
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideMessages();

      const email      = document.getElementById('email').value.trim();
      const password   = document.getElementById('password').value;
      const rememberMe = document.getElementById('rememberMe').checked;

      if (!email || !password) {
        showError(t('errEmpty'));
        return;
      }

      setLoading(true);

      try {
        const { data, error } = await sb.auth.signInWithPassword({ email, password });

        if (error) {
          const isInvalid = error.message?.toLowerCase().includes('invalid') ||
                            error.message?.toLowerCase().includes('credentials') ||
                            error.status === 400;
          showError(isInvalid ? t('errInvalid') : t('errGeneric'));
          return;
        }

        saveRemembered(email, rememberMe);
        showSuccess(t('successMsg'));

        // ロール取得 → リダイレクト先を決定
        setTimeout(async () => {
          try {
            const { data: userData } = await sb
              .from('bb_users')
              .select('role')
              .eq('id', data.user.id)
              .single();

            const role = userData?.role || 'user';
            if (role === 'super_admin') {
              location.href = 'admin-super.html';
            } else if (role === 'company_admin') {
              location.href = 'admin-company.html';
            } else {
              location.href = 'home.html';
            }
          } catch {
            location.href = 'home.html';
          }
        }, 800);

      } catch (err) {
        showError(t('errGeneric'));
      } finally {
        setLoading(false);
      }
    });

    // ── 既ログイン済みなら自動リダイレクト ──
    (async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (session) {
        try {
          const { data: userData } = await sb
            .from('bb_users')
            .select('role')
            .eq('id', session.user.id)
            .single();
          const role = userData?.role || 'user';
          if (role === 'super_admin') location.href = 'admin-super.html';
          else if (role === 'company_admin') location.href = 'admin-company.html';
          else location.href = 'home.html';
        } catch {
          location.href = 'home.html';
        }
      }
    })();

    // 初期表示
    // 保存済み言語のボタンをアクティブに
    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.lang === currentLang);
    });
    applyLang();
  </script>
</body>
</html>
